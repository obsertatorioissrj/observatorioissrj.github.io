<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Observatório ISS RJ</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --text-main: #f5f5f5;
      --text-muted: #a3a3a3;
      --accent-yellow: #eab308;
      --accent-red: #ef4444;
      --border-color: #333;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .grid-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .title-block {
      color: var(--accent-yellow);
      margin-top: 0;
    }
    .progress-bar-container {
      background-color: #333;
      border-radius: 10px;
      height: 30px;
      width: 100%;
      overflow: hidden;
      margin: 15px 0;
    }
    .progress-bar-fill {
      background-color: var(--accent-yellow);
      height: 100%;
      width: 0%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      transition: width 0.5s ease-in-out;
    }
    .pie-chart {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: 0 auto 15px;
      background: conic-gradient(var(--accent-red) 0% 0%, #333 0% 100%);
    }
    .big-number {
      font-size: 4rem;
      font-weight: bold;
      color: var(--accent-red);
      margin: 15px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid var(--border-color);
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #262626;
      color: var(--accent-yellow);
    }
    p {
      color: var(--text-muted);
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="card">
      <h2 class="title-block">Nomeações vs Vagas Imediatas (50)</h2>
      <div class="progress-bar-container">
        <div id="termometro-fill" class="progress-bar-fill"></div>
      </div>
      <p id="texto-dias"></p>
    </div>

    <div class="grid-row">
      <div class="card">
        <h2 class="title-block">Exonerações</h2>
        <div id="grafico-pizza" class="pie-chart"></div>
        <p id="texto-exonerados"></p>
      </div>

      <div class="card">
        <h2 class="title-block">Desistências</h2>
        <div id="numero-desistencia" class="big-number">0</div>
        <p id="texto-desistencia"></p>
      </div>
    </div>

    <div class="card" style="padding: 0; border: none;">
      <table>
        <thead>
          <tr>
            <th>Posição</th>
            <th>Nome</th>
            <th>Situação</th>
            <th>Data Nomeação</th>
            <th>Data Exoneração</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
